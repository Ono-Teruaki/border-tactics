<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>見た目の試作</title>
    <link rel="stylesheet" href="./mock.css" />
  </head>
  <body>
    <div id="stage"></div>
    <header class="hud top">
      <div class="turn">3手目<small>/12</small></div>
      <div class="score"><b class="me">1</b><span>-</span><b class="en">0</b></div>
      <nav id="themes"></nav>
    </header>
    <footer class="hud bottom">
      <div class="unit">
        <span class="badge">狙</span>
        <div>
          <b>スナイパー</b>
          <small>HP 16/16 ・ 狙撃態勢</small>
        </div>
        <div class="odds"><small>命中</small><b>72%</b></div>
      </div>
      <button class="go">実行</button>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
